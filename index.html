<title>Trench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{
  --abyss:#050a14; --shallow:#0c1729; --panel:rgba(9,16,30,.94); --line:#22324d; --hair:rgba(125,147,184,.22);
  --foam:#e8f1ff; --drift:#7d93b8; --cyan:#4de3ff; --pink:#ff5d8f;
  --t-plankton:#8fa3c4; --t-tooclever:#ff9f43; --t-schooler:#4de3ff; --t-rare:#ff5252; --t-deepcut:#9d7bff; --t-pearl:#ffd166; --t-miss:#3d4f6e;
  --font:"VT323",ui-monospace,Menlo,Consolas,monospace;
  --steps:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--foam);font-family:var(--font);font-size:18px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;overflow:clip;user-select:none;-webkit-user-select:none}
canvas{display:block}
#sea{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#world{position:absolute;left:0;right:0;top:0;height:0;will-change:transform}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(1,3,8,.85) 100%);opacity:.25}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.55}
#app.shake{animation:shake .45s steps(6)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,2px)}}

/* stepped pixel boxes */
.px{position:relative;background:var(--bd,var(--line));clip-path:var(--steps)}
.px::before{content:"";position:absolute;inset:2px;background:var(--bg,var(--panel));clip-path:var(--steps);z-index:0}
.px>*{position:relative;z-index:1}

/* surface title */
.title-block{position:absolute;left:0;right:0;top:-336px;text-align:center;padding:0 16px;pointer-events:none;transition:opacity .8s}
.title{font-size:clamp(76px,17vw,132px);line-height:.9;letter-spacing:.06em;color:#fff;text-shadow:-4px 0 0 var(--pink),4px 0 0 var(--cyan),0 5px 0 rgba(22,48,80,.28)}
.title span{display:inline-block;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tagline{margin-top:10px;font-size:22px;letter-spacing:.55em;color:#1c86ad;text-shadow:0 0 10px rgba(255,255,255,.6)}
.subline{margin-top:14px;font-size:18px;letter-spacing:.12em;color:#3d5f82}
@media (prefers-reduced-motion:reduce){.title span{animation:none}}

/* ambient depth labels */
.amb{position:absolute;font-size:15px;letter-spacing:.12em;color:rgba(160,185,220,.55);white-space:nowrap;transform:translateY(-50%);pointer-events:none}
.amb.L{left:max(16px,6vw)}.amb.R{right:max(56px,8vw)}
.amb.major{color:rgba(77,227,255,.8);letter-spacing:.3em;font-size:17px}

/* prompt card */
.pcard{position:absolute;left:50%;width:min(560px,calc(100% - 32px));transform:translate(-50%,-50%);--bd:#2a3b59;--bg:rgba(8,14,26,.93);animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both}
.pcard .in{padding:20px 24px 16px}
.pcard .rnd{font-size:15px;letter-spacing:.4em;color:var(--pink)}
.pcard .prompt{margin-top:8px;font-size:clamp(28px,6.6vw,38px);line-height:1.05;color:var(--foam);text-wrap:balance;text-shadow:0 0 12px rgba(232,241,255,.15)}
.pcard .hint{margin-top:10px;font-size:15px;letter-spacing:.14em;color:var(--drift)}
.pcard::after{content:"";position:absolute;inset:2px;z-index:2;pointer-events:none;clip-path:var(--steps);background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,-30%)}to{opacity:1;transform:translate(-50%,-50%)}}
.pcard.out{animation:cardOut .45s forwards}
@keyframes cardOut{to{opacity:0;transform:translate(-50%,-62%)}}

/* tier lines while sinking */
.tline{position:absolute;left:5%;right:52px;height:0;border-top:2px dotted var(--tc);opacity:.55;transition:opacity .5s}
.tline span{position:absolute;right:0;bottom:4px;font-size:15px;letter-spacing:.14em;color:var(--tc);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tline span img{width:16px;height:16px;image-rendering:pixelated}
.tline.hit{opacity:1;border-top-style:solid;box-shadow:0 0 12px var(--tc)}
.tline.gone{opacity:0}
.sinker{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(var(--rot,0deg));--bd:var(--tc,#3a5a86);--bg:rgba(10,20,38,.94);white-space:nowrap}
.sinker .in{padding:8px 18px;font-size:30px;letter-spacing:.12em;color:var(--tc,var(--foam));text-shadow:0 0 10px var(--tc,transparent)}
.sinker.fade{transition:opacity .6s;opacity:0}

/* landed panel */
.landed{position:absolute;left:50%;width:min(520px,calc(100% - 32px));transform:translate(-50%,-50%);text-align:center;animation:landIn .6s cubic-bezier(.2,.8,.2,1) both;--tc:var(--t-miss)}
.landed img{width:60px;height:60px;image-rendering:pixelated;filter:drop-shadow(0 0 10px var(--tc))}
.landed .tname{margin-top:8px;font-size:clamp(40px,10vw,54px);letter-spacing:.14em;color:var(--tc);text-shadow:0 0 16px var(--tc)}
.landed .tans{margin-top:4px;font-size:26px;color:var(--foam)}
.landed .tpts{margin-top:10px;font-size:24px;color:var(--foam)}
.landed .tpts b{font-weight:400;color:var(--tc)}
.landed .tsub{margin:10px auto 0;max-width:36ch;font-size:17px;letter-spacing:.08em;line-height:1.25;color:var(--drift)}
.landed.miss .tname{color:#5a6f93;text-shadow:none}
.landed.out{animation:landOut .45s forwards}
@keyframes landOut{to{opacity:0;transform:translate(-50%,-58%)}}
@keyframes landIn{from{opacity:0;transform:translate(-50%,-40%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 10px) 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none;transition:opacity .4s}
.pod{min-width:92px;--bd:#2a3b59;--bg:rgba(8,14,26,.9)}
.pod .in{padding:6px 12px 4px}
.pod .lab{font-size:12px;letter-spacing:.3em;color:var(--drift)}
.pod .val{font-size:30px;line-height:1;color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(77,227,255,.35)}
.pod.score{text-align:right}.pod.score .val{color:var(--pink);text-shadow:0 0 8px rgba(255,93,143,.35)}
.pod .val.slam{animation:slam .5s}
@keyframes slam{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(1)}}
.hud-mid{text-align:center;padding-top:6px}
#dots{display:flex;gap:4px;justify-content:center}
#dots i{width:12px;height:12px;background:#16233a;box-shadow:inset 0 0 0 1px #2a3b59}
#dots i.cur{background:var(--pink);box-shadow:0 0 8px var(--pink)}
#dots i.done{background:var(--c,#3d4f6e)}
#pcount{margin-top:4px;font-size:12px;letter-spacing:.3em;color:var(--drift)}
.iconbtn{position:absolute;width:34px;height:32px;--bd:#2a3b59;--bg:rgba(8,14,26,.88);color:var(--drift);display:grid;place-items:center}
.iconbtn svg{width:18px;height:16px;position:relative;z-index:1}
.iconbtn:hover{color:var(--foam)}
#menuBtn{left:16px;top:calc(var(--safe-t) + 74px)}
#muteBtn{right:16px;top:calc(var(--safe-t) + 74px)}
#app[data-phase="surface"] #hud{opacity:0}
#app.kb .iconbtn{opacity:0;pointer-events:none}
#app[data-phase="surface"] #menuBtn,#app[data-phase="surface"] #muteBtn{top:calc(var(--safe-t) + 14px)}

/* mascot */
#mascot{position:absolute;left:0;top:0;width:44px;height:44px;cursor:pointer;will-change:transform}
#mascot img{width:44px;height:44px;transform:scaleX(var(--flip,1));image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(255,93,143,.6))}
#mascot .blub{position:absolute;left:36px;top:-12px;font-size:16px;color:var(--foam);opacity:0;pointer-events:none}
#mascot .blub.show{animation:blub 1.1s ease-out}
@keyframes blub{0%{opacity:0;transform:translateY(4px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* dock */
#dock{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(var(--safe-b) + 14px);display:flex;justify-content:center;transform:translateY(calc(-1 * var(--kb,0px)));pointer-events:none}
#dock>div{width:min(560px,100%);pointer-events:auto}
.big{display:block;width:100%;--bd:var(--cyan);--bg:rgba(8,16,30,.93);filter:drop-shadow(0 0 10px rgba(77,227,255,.35))}
.big .in{padding:16px 10px;font-size:26px;letter-spacing:.3em;text-align:center}
.big:hover{--bg:rgba(14,30,52,.95)}
.big.pinkb{--bd:var(--pink);filter:drop-shadow(0 0 10px rgba(255,93,143,.35))}
.dock-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.dock-row .grow{flex:1}
#diveNo{font-size:15px;letter-spacing:.24em;color:var(--drift)}
.chip{--bd:#2a3b59;--bg:rgba(8,14,26,.9)}
.chip .in{padding:6px 12px;font-size:15px;letter-spacing:.2em;color:var(--drift)}
.chip:hover .in{color:var(--foam)}
.link{font-size:15px;letter-spacing:.2em;color:#d9ecff;text-shadow:0 1px 4px rgba(0,0,0,.6);margin-bottom:10px}
.link:hover{color:var(--cyan)}
.msg{min-height:24px;margin-bottom:8px;text-align:center;font-size:17px;letter-spacing:.08em;color:var(--t-tooclever)}
.msg .corr{display:inline-flex;flex-direction:column;gap:2px;padding:6px 14px;background:rgba(8,14,26,.92);box-shadow:inset 0 0 0 2px #2a3b59;color:var(--foam)}
.msg .corr b{font-weight:400;color:var(--cyan)}
.msg .corr small{font-size:14px;color:var(--drift);letter-spacing:.14em}
.msg.status{color:var(--drift);letter-spacing:.2em}
.play-row{display:flex;gap:10px;align-items:center}
#clock{position:relative;flex:0 0 52px;height:52px}
#clock svg{position:absolute;inset:0;width:52px;height:52px;transform:rotate(-90deg)}
#clock .trk{fill:rgba(8,14,26,.92);stroke:#1b2c47;stroke-width:4}
#clock .arc{fill:none;stroke:var(--cyan);stroke-width:4;stroke-dasharray:138.2;transition:stroke .3s}
#clock.low .arc{stroke:var(--pink)}
#clockNum{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:var(--foam);font-variant-numeric:tabular-nums}
.field{flex:1;--bd:#3a5a86;--bg:rgba(6,12,24,.95)}
.field:focus-within{--bd:var(--cyan)}
#answer{display:block;width:100%;box-sizing:border-box;background:transparent;border:0;outline:0;color:var(--foam);font:inherit;font-size:24px;padding:11px 14px;user-select:text;-webkit-user-select:text}
#answer::placeholder{color:#50668b}
.dive{flex:0 0 auto;--bd:var(--pink);--bg:#c93f6d}
.dive .in{padding:13px 16px;font-size:22px;letter-spacing:.2em;color:#fff}
.dive:disabled{opacity:.5;cursor:default}
#clockBar{height:3px;margin:8px 0 0 62px;background:#14223a}
#clockBar i{display:block;height:100%;width:100%;background:var(--cyan);transform-origin:left}

/* overlays */
.sheet{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,rgba(4,8,16,.84),rgba(4,8,16,.95));user-select:text;-webkit-user-select:text;animation:fadeIn .5s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet .col{width:min(580px,100%);box-sizing:border-box;margin:0 auto;padding:calc(var(--safe-t) + 20px) 16px calc(var(--safe-b) + 40px)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:30px;letter-spacing:.08em;color:#fff;text-shadow:-2px 0 0 var(--pink),2px 0 0 var(--cyan)}
.sheet-top .meta{font-size:15px;letter-spacing:.22em;color:var(--drift);text-align:right}
.close{width:36px;height:34px;--bd:#2a3b59;--bg:rgba(8,14,26,.9);color:var(--drift);font-size:24px;display:grid;place-items:center}
.bigscore{display:flex;align-items:baseline;gap:14px;margin-top:18px}
.bigscore .n{font-size:92px;line-height:.85;color:#fff;font-variant-numeric:tabular-nums}
.bigscore .d{font-size:18px;color:var(--cyan);letter-spacing:.1em}
.verdict{margin-top:6px;font-size:20px;color:var(--foam)}
.fathom{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 12px;padding-top:10px;border-top:1px solid var(--hair);font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--foam)}
.fathom small{font-size:13px;letter-spacing:.2em;color:var(--drift)}
.log{position:relative;height:210px;margin-left:34px}
.log .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--hair)}
.log .grid span{position:absolute;left:-34px;top:-8px;font-size:12px;color:var(--drift)}
.log .cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.log .c{position:relative}
.log .c .stem{position:absolute;left:50%;top:0;width:1px;opacity:.5}
.log .c img,.log .c .missdot{position:absolute;left:50%;width:22px;height:22px;transform:translate(-50%,-50%);image-rendering:pixelated;animation:sinkIn .8s cubic-bezier(.2,.8,.2,1) both}
.log .c .missdot{border:2px dashed #3d4f6e;border-radius:50%;box-sizing:border-box;width:16px;height:16px}
.log .c .num{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--drift)}
@keyframes sinkIn{from{opacity:0;top:0}}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:36px}
.btns .wide{grid-column:1/-1}
.btn{--bd:#2a3b59;--bg:rgba(8,14,26,.92)}
.btn .in{padding:12px 10px;text-align:center;font-size:19px;letter-spacing:.2em}
.btn.cyan{--bd:var(--cyan)}.btn.pinkb{--bd:var(--pink)}
.btn:hover{--bg:rgba(16,30,52,.95)}
.bear{display:grid;grid-template-columns:28px 76px 1fr;gap:8px 10px;align-items:center;font-size:16px}
.bear img{width:18px;height:18px;image-rendering:pixelated}
.bear .r{color:var(--drift);font-variant-numeric:tabular-nums}
.bear .v{color:var(--drift)}
.bear .me{color:var(--foam)}
.bear .me.v::after{content:"  ◂ you";color:var(--pink)}
.catch{display:flex;flex-direction:column;gap:6px}
.crow{--bd:#1d2b44;--bg:rgba(8,14,26,.85)}
.crow>button{display:grid;grid-template-columns:22px 1fr auto 34px 16px;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px}
.crow .i{color:var(--drift);font-size:15px}
.crow .q{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--drift);line-height:1.15}
.crow .q b{display:block;margin-top:3px;font-weight:400;font-size:20px;letter-spacing:.04em;text-transform:none;color:var(--tc,var(--foam))}
.crow .p{font-size:18px;color:var(--tc,var(--drift));text-align:right;font-variant-numeric:tabular-nums}
.crow .x{color:var(--drift)}
.crow img{width:22px;height:22px;image-rendering:pixelated}
.reveal{padding:0 14px 14px;font-size:16px;line-height:1.3;color:var(--drift)}
.reveal .gem{color:var(--t-pearl);margin-bottom:8px}
.reveal .gem i{font-style:normal;color:var(--drift)}
.reveal .tier{margin-top:8px}
.reveal .tier b{font-weight:400;letter-spacing:.2em;font-size:14px}
.reveal .tier .more{color:var(--cyan);text-decoration:underline;cursor:pointer}
.reveal .you{color:var(--pink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{--bd:#1d2b44;--bg:rgba(8,14,26,.85)}
.stats .in{padding:10px 4px}
.stats b{display:block;font-weight:400;font-size:32px;color:var(--foam);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:.24em;color:var(--drift)}
.next{margin-top:18px;text-align:center;font-size:18px;letter-spacing:.24em;color:var(--drift)}
.next b{font-weight:400;color:var(--cyan);font-variant-numeric:tabular-nums}
.genline{margin-top:10px;text-align:center;font-size:15px;letter-spacing:.12em;color:var(--drift);min-height:20px}
.genline .ok{color:var(--t-schooler)}
.dist svg{width:100%;height:auto;display:block}
.dist p{margin:4px 0 0;font-size:14px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}
.alist{display:flex;flex-direction:column;gap:6px}
.arow{--bd:#1d2b44;--bg:rgba(8,14,26,.85)}
.arow>button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:12px 14px;text-align:left;font-size:19px}
.arow .when{color:var(--drift);font-size:16px;letter-spacing:.08em}
.arow .res{color:var(--cyan);letter-spacing:.06em}
.empty{padding:18px 4px;color:var(--drift);font-size:17px;line-height:1.35}
.modal{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(2,5,11,.72);animation:fadeIn .3s both}
.modal .box{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;--bd:var(--cyan);--bg:rgba(8,14,26,.97)}
.modal .box .in{padding:22px 22px 18px}
.modal h2{margin:0 0 12px;font-weight:400;font-size:30px;letter-spacing:.2em}
.modal p{margin:0 0 10px;font-size:18px;line-height:1.3;color:#c6d6ee}
.modal .tiers{display:grid;grid-template-columns:24px 1fr auto;gap:6px 10px;align-items:center;margin:12px 0 14px;font-size:18px}
.modal .tiers img{width:20px;height:20px;image-rendering:pixelated}
.modal .tiers .pts{color:var(--drift);font-variant-numeric:tabular-nums}
.menu{position:absolute;inset:0;background:rgba(2,5,11,.6);animation:fadeIn .2s both}
.menu .panel{position:absolute;left:0;top:0;bottom:0;width:min(300px,86%);--bd:#2a3b59;--bg:rgba(8,14,26,.98);clip-path:none}
.menu .panel::before{clip-path:none}
.menu .panel .in{padding:calc(var(--safe-t) + 20px) 18px 20px;display:flex;flex-direction:column;gap:4px}
.menu .panel .logo{margin-bottom:14px}
.menu .item{display:flex;justify-content:space-between;padding:12px 6px;font-size:22px;letter-spacing:.14em;border-bottom:1px solid var(--hair);text-align:left}
.menu .item:hover{color:var(--cyan)}
.menu .item small{color:var(--drift);font-size:16px}
.menu .note{margin-top:14px;font-size:15px;color:var(--drift);line-height:1.35;letter-spacing:.04em}
#toast{position:absolute;left:50%;top:calc(var(--safe-t) + 130px);transform:translateX(-50%);padding:8px 16px;background:rgba(8,14,26,.95);box-shadow:inset 0 0 0 2px var(--cyan);font-size:18px;letter-spacing:.14em;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@media (max-width:420px){
  .pod{min-width:78px}.pod .val{font-size:25px}.pod .in{padding:5px 9px 3px}
  #dots i{width:10px;height:10px}
  .big .in{font-size:22px;letter-spacing:.22em}
  .dive .in{padding:13px 12px;letter-spacing:.12em}
  #answer{font-size:22px}
}
</style>

<div id="app" data-phase="surface">
  <canvas id="sea" aria-hidden="true"></canvas>
  <div id="world">
    <div class="title-block" id="titleBlock">
      <div class="title" id="title" aria-label="Trench"></div>
      <div class="tagline">THE DAILY DIVE</div>
      <div class="subline">7 prompts · 25 seconds each · rarer answers sink deeper</div>
    </div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>

}

/* ================= answer sheets ================= */
const FOLD={'ø':'o','æ':'ae','œ':'oe','ß':'ss','ł':'l','đ':'d','ð':'d','þ':'th','ı':'i'};
function norm(s){

}
function singulars(k){const o=[];if(k.length>3){if(k.endsWith('ies'))o.push(k.slice(0,-3)+'y');if(k.endsWith('es'))o.push(k.slice(0,-2));if(k.endsWith('s'))o.push(k.slice(0,-1));}return o;}
function splitList(v){if(Array.isArray(v))v=v.join('|');return String(v||'').split('|').map(x=>x.split('~').map(y=>y.trim()).filter(Boolean)).filter(n=>n.length);}
function buildSheet(e){
  const sh={q:e.q,r:e.r||'',closed:!!(e.x||e.closed),id:hashStr(e.q),exact:new Map(),loose:new Map(),tiers:{},gem:null,src:e};
  TIER_IDS.forEach(t=>sh.tiers[t]=[]);
  const put=(names,tier,quip)=>{
    const ck=norm(names[0]);if(!ck||sh.exact.has(ck))return;
    const entry={name:names[0],tier,quip:quip||null};
    for(const n of names){const k=norm(n);if(k&&!sh.exact.has(k))sh.exact.set(k,entry);}
    sh.tiers[tier].push(names[0]);
  };
  if(e.k){
    let gname='',quip='';
    if(typeof e.k==='string'){const i=e.k.indexOf('|');gname=i<0?e.k:e.k.slice(0,i);quip=i<0?'':e.k.slice(i+1);}
    else{gname=e.k.answer||'';quip=e.k.quip||'';}
    const names=String(gname).split('~').map(x=>x.trim()).filter(Boolean);
    if(names.length){put(names,'pearl',quip);sh.gem={name:names[0],quip};}
  }
  for(const [k,t] of Object.entries(SRC))for(const names of splitList(e[k]))put(names,t);
  for(const [k,en] of sh.exact)for(const v of singulars(k))if(!sh.exact.has(v)&&!sh.loose.has(v))sh.loose.set(v,en);

}
function osa(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  const m=a.length,n=b.length;let p2=null,p=new Array(n+1),c;
  for(let j=0;j<=n;j++)p[j]=j;
  for(let i=1;i<=m;i++){
    c=new Array(n+1);c[0]=i;let lo=i;
    for(let j=1;j<=n;j++){
      let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);
      c[j]=v;if(v<lo)lo=v;
    }
    if(lo>max)return max+1;p2=p;p=c;
  }
  return p[n];
}
function matchAnswer(sh,raw){
  const k=norm(raw);if(!k)return null;
  if(sh.exact.has(k))return{entry:sh.exact.get(k)};
  if(sh.loose.has(k))return{entry:sh.loose.get(k)};
  for(const v of singulars(k)){if(sh.exact.has(v))return{entry:sh.exact.get(v)};if(sh.loose.has(v))return{entry:sh.loose.get(v)};}
  const max=k.length<5?0:k.length<8?1:2;if(!max)return null;
  let best=null,bd=max+1,tie=false;
  for(const key of sh.keys){
    const d=osa(k,key,max);
    if(d<bd){bd=d;best=key;tie=false;}
    else if(d===bd&&best&&sh.exact.get(key)!==sh.exact.get(best))tie=true;
  }
  return best&&bd<=max&&!tie?{suggest:sh.exact.get(best)}:null;
}

Write ${n} NEW prompts for one dive. The magic of the game: anyone can answer every prompt instantly, but the best players dig up something crazy niche.
- Start each with "Name a", "Name an" or "Name any".
- Be creative. Take a broad, everyday category and give it a fun angle or twist, like "Name an animal without the letter A in its name", "Name a kitchen appliance (something powered)", "Name a food that's yellow", "Name something you'd find in a hotel room", "Name a car with an animal in its name", "Name a villain from a Marvel movie". Avoid dry textbook lists.
- Every prompt MUST have at least 5 answers almost anyone thinks of within 3 seconds AND a long tail of 100+ valid answers reaching truly niche picks that only enthusiasts or experts would know.
- No small closed sets (a country's neighbours, one league's teams, Olympic host cities and the like).
- Each needs a clear rule so an answer can be checked.
- Mix topics across the ${n}: food and drink, animals and nature, film/TV/music/games, sport and cars, brands and tech, everyday objects and places, science and history, words and language. No more than two from one area.
- Fair for an English-speaking adult anywhere; nothing offensive, sad or political.
- Do not repeat or closely paraphrase any of these existing prompts:
${avoid.map(q=>'- '+q).join('\n')}

Reply with only a JSON array of ${n} objects: [{"q":"Name a ...","r":"one sentence saying exactly what counts as a valid answer"}]`;
}
function sheetPrompt(t){
  return `You are writing the answer sheet for one prompt in TRENCH, a word game where rarer valid answers score more points.

Prompt: "${t.q}"
What counts: ${t.r}

Sort valid answers into tiers by how often a typical English-speaking adult would give them:
- "p" plankton: the 5-10 answers most people blurt out first.
- "c" too clever: 0-3 famously "obscure" picks that lots of people reach for to seem clever (may be empty).
- "s" schooler: 10-30 well-known answers that are not the first to mind.
- "a" rare: 20-60 genuinely uncommon answers that knowledgeable people know.
- "d" deep cut: as many truly obscure but real, verifiable answers as you can list reliably (aim for 80-200), reaching the craziest niche picks enthusiasts would know.
- "k": ONE designated gem: a satisfying deep-cut answer a few players might actually find, with an accurate one-line fun fact (max 110 characters).
Write each answer as its usual English name. Put alternate names or spellings after "~" in the same string, like "Côte d'Ivoire~Ivory Coast". Never list an answer in two tiers. Only list answers you are confident are correct.
- "closed": true only if your tiers together contain EVERY valid answer (a small complete set such as a country's neighbours or a film series); otherwise false.

Reply with only JSON: {"p":[...],"c":[...],"s":[...],"a":[...],"d":[...],"k":{"answer":"...","quip":"..."},"closed":false}`;
}
function cleanSheet(t,res){
  if(!res||typeof res!=='object')return null;
  const arr=v=>(Array.isArray(v)?v:[]).filter(x=>typeof x==='string').map(x=>x.replace(/\|/g,'/').trim().slice(0,80)).filter(Boolean);
  const e={q:t.q,r:t.r,p:arr(res.p).slice(0,15).join('|'),c:arr(res.c).slice(0,4).join('|'),s:arr(res.s).slice(0,50).join('|'),a:arr(res.a).slice(0,120).join('|'),d:arr(res.d).slice(0,300).join('|'),src:'claude'};
  if(res.k&&typeof res.k.answer==='string'&&res.k.answer.trim())e.k=res.k.answer.replace(/\|/g,'/').trim().slice(0,80)+'|'+String(res.k.quip||'').replace(/\|/g,'/').slice(0,160);
  if(res.closed===true)e.x=1;
  const total=['p','c','s','a','d'].reduce((n,x)=>n+(e[x]?e[x].split('|').length:0),0);

}
async function runPool(items,limit,fn){let i=0;await Promise.all(Array.from({length:Math.min(limit,items.length)},async()=>{while(i<items.length){const idx=i++;await fn(items[idx],idx);}}));}
async function generateSet(n,what){

  setGen({kind:'work',what,done:0,total:n,step:'picking prompts'});
  const raw=await Data.sample.json(themePrompt(n+1,[...older,...recent]),{cache:false});
  const seen=new Set(known.map(normQ));
  const themes=(Array.isArray(raw)?raw:(raw&&raw.prompts)||[]).filter(x=>x&&typeof x.q==='string'&&x.q.length<150)
    .map(x=>({q:x.q.trim(),r:String(x.r||'Any real answer that fits the prompt.').slice(0,300)}))
    .filter(x=>{const k=normQ(x.q);if(!k||seen.has(k))return false;seen.add(k);return true;}).slice(0,n);
  const out=new Array(themes.length).fill(null);let done=0;
  setGen({kind:'work',what,done:0,total:themes.length,step:'writing answer sheets'});

}

function unlimitedCandidates(){
  const today=todayKey(),todayIds=new Set((Data.index.dives[today]&&Data.index.dives[today].qs||[]).map(hashStr));
  if(S.today)S.today.prompts.forEach(p=>todayIds.add(hashStr(p.q)));
  const c=[],ids=new Set();
  const add=(q,from,ref,i)=>{const id=hashStr(q);if(ids.has(id)||todayIds.has(id))return;ids.add(id);c.push({id,from,ref,i});};
  SEED_BANK.forEach((e,i)=>add(e.q,'bank',null,i));
  for(const [bid,v] of Object.entries(Data.index.pool||{}))(v.qs||[]).forEach((q,i)=>add(q,'pool','pool/'+bid,i));
  for(const [d,v] of Object.entries(Data.index.dives||{}))if(d<today)(v.qs||[]).forEach((q,i)=>add(q,'dive','dives/'+d,i));
  return c;
}
async function ensurePool(){

      await indexUpdate(ix=>{ix.pool[bid]={qs:prompts.map(p=>p.q)};});
      setGen({kind:'pool',count:prompts.length});
    }else setGen({kind:'fail'});

async function buildUnlimited(){
  const c=unlimitedCandidates();
  const unseen=shuffle(c.filter(x=>!Data.profile.seen[x.id])),seen=shuffle(c.filter(x=>Data.profile.seen[x.id]));
  const picks=unseen.concat(seen).slice(0,ROUNDS);
  const docs={};const prompts=[];
  for(const p of picks){
    if(p.from==='bank'){prompts.push(SEED_BANK[p.i]);continue;}
    if(!(p.ref in docs))docs[p.ref]=await getDoc(p.ref);
    const d=docs[p.ref];const pr=d&&d.prompts&&d.prompts[p.i];
    prompts.push(pr&&pr.q?pr:null);
  }
  const have=prompts.filter(Boolean);
  if(have.length<ROUNDS){const extra=unseenBank(have).concat(shuffle(SEED_BANK.slice()));for(const e of extra){if(have.length>=ROUNDS)break;if(!have.some(h=>h.q===e.q))have.push(e);}}
  return have.slice(0,ROUNDS);
}

  g.clearRect(0,0,w,h);
  if(ySurf>0){
    const top=ySurf-H/PX;const sg=g.createLinearGradient(0,top,0,ySurf);sg.addColorStop(0,'#6fbfe3');sg.addColorStop(.7,'#b4e2f7');sg.addColorStop(1,'#e2f5ff');
    g.fillStyle=sg;g.fillRect(0,0,w,Math.ceil(ySurf)+1);
    const sx=w*.8,sy=m2y(-178);const gl=g.createRadialGradient(sx,sy,2,sx,sy,40);gl.addColorStop(0,'rgba(255,240,180,.75)');gl.addColorStop(1,'rgba(255,240,180,0)');
    g.fillStyle=gl;g.fillRect(sx-40,sy-40,80,80);
    g.fillStyle='#ffe9a8';g.beginPath();g.arc(sx,sy,11,0,7);g.fill();g.fillStyle='#fff6d6';g.beginPath();g.arc(sx-2,sy-2,6,0,7);g.fill();
    for(const c of clouds){
      c.x+=c.sp/60;if(c.x>1.25)c.x=-.25;
      const x=c.x*w,y=m2y(c.m),s=c.s;
      g.fillStyle='rgba(255,255,255,.95)';
      g.fillRect(x-14*s,y-2*s,30*s,5*s);g.fillRect(x-9*s,y-6*s,14*s,5*s);g.fillRect(x-2*s,y-8*s,10*s,7*s);g.fillRect(x+7*s,y-4*s,8*s,4*s);
      g.fillStyle='rgba(190,225,245,.9)';g.fillRect(x-14*s,y+2*s,30*s,2*s);
    }
  }
  const y0=Math.max(0,Math.floor(ySurf));
  if(y0<h){
    const m0=Math.max(0,y2m(y0));const wg=g.createLinearGradient(0,y0,0,h);
    wg.addColorStop(0,rgba(depthRGB(m0)));wg.addColorStop(.5,rgba(depthRGB((m0+mBot)/2)));wg.addColorStop(1,rgba(depthRGB(mBot)));
    g.fillStyle=wg;g.fillRect(0,y0,w,h-y0);
  }
  if(cy<800&&ySurf<h){
    const a=.075*(1-clamp(cy/800,0,1)),len=560*2/PX;
    g.fillStyle=`rgba(200,235,255,${a})`;
    for(let i=0;i<6;i++){const x=w*(.08+.17*i)+Math.sin(ts*.25+i*1.7)*w*.02;g.beginPath();g.moveTo(x-2,ySurf);g.lineTo(x+4,ySurf);g.lineTo(x+4+len*.32,ySurf+len);g.lineTo(x-2+len*.2,ySurf+len);g.closePath();g.fill();}
  }
  // kelp forests near the edges
  for(let side=0;side<2;side++)for(let k=0;k<3;k++){
    const base=side?w-(4+k*10):(4+k*10),mS=150+k*80,mE=980-k*120;
    const ya=Math.max(0,Math.floor(m2y(mS))),yb=Math.min(h,Math.ceil(m2y(mE)));
    if(ya>=yb)continue;
    g.fillStyle=`rgba(3,12,24,${.55-k*.1})`;
    for(let y=ya;y<yb;y++){const m=y2m(y),sway=Math.sin(m*.018+ts*.8+k*2+side)*2.5;const x=base+sway;g.fillRect(x,y,2,1);
      const lp=(m+k*11)%24;if(lp<5){const dir=(Math.floor((m+k*11)/24)%2)?1:-1;g.fillRect(dir>0?x+2:x-3-Math.floor(lp/2),y,3+Math.floor(lp/2),1);}}
  }
  // rock walls and the trench
  for(let y=0;y<h;y++){
    const m=y2m(y);if(m<800)continue;
    const c=depthRGB(m),dark=[c[0]*.45,c[1]*.45,c[2]*.5];g.fillStyle=rgba(dark.map(Math.round));
    const wl=wallWidth(m,0,w),wr=wallWidth(m,1,w);
    if(wl>0)g.fillRect(0,y,Math.ceil(wl),1);if(wr>0)g.fillRect(w-Math.ceil(wr),y,Math.ceil(wr),1);
  }
  const yF=m2y(7000);
  if(yF<h){g.fillStyle='#03060d';for(let x=0;x<w;x++){const y=yF+noise1(x/9)*7-2;g.fillRect(x,y,1,h-y);}}
  // fish & glowing things
  const dt=1/60;
  for(const f of fish){
    f.x+=f.sp*dt;if(f.x<-.1)f.x=1.1;if(f.x>1.1)f.x=-.1;
    if(f.m-cy>230||f.m<8){f.m=Math.max(15,cy-rnd(150,210));f.x=Math.random();}
    else if(cy-f.m>230){f.m=cy+rnd(150,210);f.x=Math.random();}
    const y=m2y(f.m+Math.sin(ts+f.ph)*2),x=f.x*w,dir=f.sp>0?1:-1;
    if(y<-10||y>h+10)continue;
    if(f.m<1100){g.fillStyle='rgba(4,12,24,.55)';g.beginPath();g.ellipse(x,y,f.s*1.7,f.s*.7,0,0,7);g.fill();g.beginPath();g.moveTo(x-dir*f.s*1.5,y);g.lineTo(x-dir*f.s*2.6,y-f.s*.8);g.lineTo(x-dir*f.s*2.6,y+f.s*.8);g.closePath();g.fill();}
    else if(f.m<3600){g.fillStyle='rgba(2,6,12,.8)';g.beginPath();g.ellipse(x,y,f.s*1.6,f.s*1.1,0,0,7);g.fill();const p=.5+.5*Math.sin(ts*3+f.ph);g.fillStyle=`rgba(160,245,255,${.5+.5*p})`;g.fillRect(Math.round(x+dir*f.s*2.2),Math.round(y-f.s*1.6),1,1);}
    else{const p=.4+.3*Math.sin(ts*1.5+f.ph);g.fillStyle=`rgba(120,200,255,${p*.5})`;g.beginPath();g.arc(x,y,f.s*.9,Math.PI,0);g.fill();g.fillRect(x-f.s*.6,y,1,f.s*1.5);g.fillRect(x+f.s*.4,y,1,f.s*1.8);}
  }
  // marine snow
  for(const s of snow){
    const yy=((s.y*h-cy*2/PX*s.par)%h+h)%h;if(yy<ySurf)continue;
    const xx=((s.x*w+ts*1.5*s.par)%w+w)%w;const m=y2m(yy);
    if(s.glow&&m>900){const p=.5+.5*Math.sin(ts*2+s.x*20);g.fillStyle=`rgba(77,227,255,${s.a*p})`;}
    else g.fillStyle=`rgba(210,230,255,${s.a*(m<300?.5:.8)})`;
    g.fillRect(Math.round(xx),Math.round(yy),1,1);
  }
  // surface + boat
  if(ySurf>-6&&ySurf<h+4){
    for(let x=0;x<w;x++){const y=ySurf+Math.sin(x*.25+ts*2)*.7+Math.sin(x*.07-ts)*.5;g.fillStyle=rgba(depthRGB(0));g.fillRect(x,y,1,3);g.fillStyle='rgba(225,245,255,.8)';g.fillRect(x,Math.round(y),1,1);}
    const bx=Math.round(w*.3),by=Math.round(ySurf+Math.sin(ts*1.6)*.7);
    g.fillStyle='#14233a';
    g.fillRect(bx-12,by-2,25,1);g.fillRect(bx-11,by-1,23,1);g.fillRect(bx-10,by,21,1);g.fillRect(bx-8,by+1,17,1);
    g.fillRect(bx-5,by-6,9,4);g.fillRect(bx+4,by-4,3,2);g.fillRect(bx-1,by-15,1,9);g.fillRect(bx-1,by-7,8,1);
    g.fillStyle='#ffd166';g.fillRect(bx-3,by-5,1,1);g.fillRect(bx,by-5,1,1);
    const wave=Math.floor(ts*4)%2;g.fillStyle='#ff5d8f';g.fillRect(bx,by-15,4,1);g.fillRect(bx,by-14,5+wave,1);g.fillRect(bx,by-13,4-wave,1);
  }
}
/* fx canvas: bubbles, sparks, depth ruler */
function drawFx(dt,cy,ts){
  const g=fxG,C=center();g.clearRect(0,0,W,H);
  const m2s=m=>C+(m-cy)*2;
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.life-=dt;b.m+=b.vm*dt;if(b.life<=0||b.m<0){bubbles.splice(i,1);continue;}
    const y=m2s(b.m),x=b.x+Math.sin(ts*3+b.wob)*3;g.strokeStyle=`rgba(220,240,255,${Math.min(1,b.life)*.7})`;g.lineWidth=1;g.beginPath();g.arc(x,y,b.r,0,7);g.stroke();}
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.t+=dt;if(p.t>p.life){sparks.splice(i,1);continue;}
    p.x+=p.vx*dt;p.m+=p.vm*dt;p.vx*=.96;p.vm*=.96;const a=1-p.t/p.life;g.fillStyle=p.color;g.globalAlpha=a;g.fillRect(p.x-p.r/2,m2s(p.m)-p.r/2,p.r,p.r);g.globalAlpha=1;}
  if(S.phase==='surface')return;
  const x0=W-10;g.font='11px VT323, monospace';g.textAlign='right';
  const mTop=cy-C/2,mBot=cy+(H-C)/2;
  for(let m=Math.max(0,Math.floor(mTop/20)*20);m<=mBot;m+=20){
    const y=m2s(m),major=m%100===0;g.fillStyle=`rgba(125,147,184,${major?.55:.3})`;g.fillRect(x0-(major?10:5),Math.round(y),major?10:5,1);
    if(major&&m%(cy>1500?500:100)===0){g.fillStyle='rgba(125,147,184,.6)';g.fillText(m?'-'+m.toLocaleString('en-US')+'m':'0m',x0-13,y+3);}
  }
  g.fillStyle='rgba(125,147,184,.35)';g.fillRect(x0,0,1,H);
  const yy=m2s(S.visDepth);if(yy>0&&yy<H){g.fillStyle='#ff5d8f';g.fillRect(x0-22,Math.round(yy),22,1);g.beginPath();g.moveTo(x0+1,yy);g.lineTo(x0+6,yy-4);g.lineTo(x0+6,yy+4);g.closePath();g.fill();g.fillText('YOU',x0-25,yy+3);}
}

/* ================= main loop ================= */
let last=performance.now();const mascot=$('#mascot'),vignette=$('#vignette');
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const ts=now/1000;
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i],p=(now-t.t0)/t.dur;if(p>=1){tweens.splice(i,1);t.upd(t.ease(1));t.done&&t.done();}else t.upd(t.ease(Math.max(0,p)));}
  cam.y+=(cam.target-cam.y)*(1-Math.exp(-5*dt));
  const cy=cam.y+(reduceMotion?0:Math.sin(ts*.45)*1.1);
  world.style.transform=`translate3d(0,${Math.round(center()-2*cy)}px,0)`;
  drawSea(ts,cy);drawFx(dt,cy,ts);
  if(S.phase==='answering'){
    S.left-=dt*1000;const sec=Math.ceil(S.left/1000);
    if(sec<S.lastTick){S.lastTick=sec;if(sec<=5&&sec>0)Sfx.tick();}
    if(S.left<=0){S.left=0;renderClock();timeUp();}else renderClock();
  }
  if(S.phase!=='sinking')S.visDepth+=(S.depth-S.visDepth)*(1-Math.exp(-6*dt));
  hud.depth.textContent=fmtM(Math.max(0,S.visDepth));
  vignette.style.opacity=String(Math.min(.8,.25+Math.max(0,cy)/2400));
  const mx=S.phase==='surface'?W*.12:W*.08+Math.sin(ts*.7)*10,my=S.phase==='surface'?center()+120+Math.sin(ts*1.3)*6:center()+30+Math.sin(ts*1.1)*14;
  mascot.style.transform=`translate(${Math.round(mx)}px,${Math.round(my)}px)`;mascot.style.setProperty('--flip',Math.cos(ts*.35)>0?1:-1);
  requestAnimationFrame(frame);
}

/* ================= events ================= */
dock.form.addEventListener('submit',e=>{e.preventDefault();submit();});
dock.dive.addEventListener('click',()=>submit());
dock.input.addEventListener('input',()=>{Sfx.key();if(S.correction&&dock.input.value.trim()!==S.correction.raw){S.correction=null;dock.msg.textContent='';}else if(S.phase==='answering'&&dock.msg.textContent&&!S.correction)dock.msg.textContent='';});
dock.nextBtn.addEventListener('click',next);
dock.begin.addEventListener('click',beginDaily);
$('#unlBtn').addEventListener('click',()=>{Sfx.ensure();Sfx.click();startUnlimited();});

$('#menuBtn').addEventListener('click',()=>{Sfx.ensure();Sfx.click();openMenu();});

mascot.addEventListener('click',()=>{Sfx.ensure();Sfx.blub();const b=mascot.querySelector('.blub');b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
  const r=mascot.getBoundingClientRect(),m=cam.y+(r.top+22-center())/2;for(let i=0;i<6;i++)spawnBubble(r.left+22+rnd(-10,14),m-rnd(2,8),rnd(1,3));burst(r.left+22,m,'#ff5d8f',10);});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&S.phase==='landed'){e.preventDefault();next();}
  if(e.key==='Escape'){['#howto','#menu'].forEach(s=>{$(s).hidden=true;});}

window.addEventListener('resize',resize);
app.addEventListener('scroll',()=>{if(app.scrollTop||app.scrollLeft){app.scrollTop=0;app.scrollLeft=0;}});
const vv=window.visualViewport;
function onVV(){if(!vv)return;KB=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));app.style.setProperty('--kb',KB+'px');app.classList.toggle('kb',KB>40);if(S.phase==='preview'||S.phase==='answering')cam.target=promptCam();}
if(vv){vv.addEventListener('resize',onVV);vv.addEventListener('scroll',onVV);}

resize();renderMute();updateDots();refreshLanding();

if(!LS.get('seenHow',0))setTimeout(openHowto,900);
bootP=(async()=>{
  try{await initCaps();}catch(e){}
